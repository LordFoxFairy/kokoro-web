syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";
import "kokoro/iam/v1/types.proto";

message CreateSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string code = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$", max_len: 80}];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
}
message CreateSiteResponse { SiteRecord site = 1; SiteMemberRecord owner = 2; bool replayed = 3; }

message GetSiteRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
  bool include_deleted = 3;
}
message GetSiteResponse { optional SiteRecord site = 1; }

message ListSitesRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  PageInput page = 2;
  bool include_deleted = 3;
  string query = 4 [(buf.validate.field).string.max_len = 160];
  string status = 5 [(buf.validate.field).string.max_len = 32];
}
message ListSitesResponse { repeated SiteRecord sites = 1; PageOutput page = 2; }

message UpdateSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
}
message UpdateSiteResponse { SiteRecord site = 1; bool replayed = 2; }

message SuspendSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
}
message SuspendSiteResponse { SiteRecord site = 1; bool replayed = 2; }
message ReactivateSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
}
message ReactivateSiteResponse { SiteRecord site = 1; bool replayed = 2; }
message DeleteSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
}
message DeleteSiteResponse { SiteRecord site = 1; bool replayed = 2; }
message RestoreSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
}
message RestoreSiteResponse { SiteRecord site = 1; bool replayed = 2; }

message AddSiteMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
  string user_id = 3 [(buf.validate.field).string.uuid = true];
  string role_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message AddSiteMemberResponse { SiteMemberRecord member = 1; bool replayed = 2; }

message ListSiteMembersRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
  PageInput page = 3;
  bool include_deleted = 4;
}
message ListSiteMembersResponse { repeated SiteMemberRecord members = 1; PageOutput page = 2; }

message ChangeSiteMemberRoleRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
  string role_key = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string site_id = 4 [(buf.validate.field).string.uuid = true];
}
message ChangeSiteMemberRoleResponse { SiteMemberRecord member = 1; bool replayed = 2; }

message SuspendSiteMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
  string site_id = 3 [(buf.validate.field).string.uuid = true];
}
message SuspendSiteMemberResponse { SiteMemberRecord member = 1; bool replayed = 2; }
message ReactivateSiteMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
  string site_id = 3 [(buf.validate.field).string.uuid = true];
}
message ReactivateSiteMemberResponse { SiteMemberRecord member = 1; bool replayed = 2; }
message RemoveSiteMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
  string site_id = 3 [(buf.validate.field).string.uuid = true];
}
message RemoveSiteMemberResponse { SiteMemberRecord member = 1; bool replayed = 2; }
message RestoreSiteMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
  string site_id = 3 [(buf.validate.field).string.uuid = true];
}
message RestoreSiteMemberResponse { SiteMemberRecord member = 1; bool replayed = 2; }

message SelectSiteRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string.uuid = true];
}
message SelectSiteResponse { SiteRecord site = 1; }

message ListSiteRolesRequest { string request_id = 1 [(buf.validate.field).string.uuid = true]; string site_id = 2 [(buf.validate.field).string.uuid = true]; bool include_deleted = 3; }
message ListSiteRolesResponse { repeated SiteRoleRecord roles = 1; }
message CreateSiteRoleRequest { CommandContext command = 1 [(buf.validate.field).required = true]; string site_id = 2 [(buf.validate.field).string.uuid = true]; string key = 3 [(buf.validate.field).string = {pattern: "^[a-z][a-z0-9_]{0,63}$", max_len: 64}]; string name = 4 [(buf.validate.field).string = {min_len: 1, max_len: 120}]; string description = 5 [(buf.validate.field).string = {min_len: 1, max_len: 500}]; repeated string permission_keys = 6; }
message CreateSiteRoleResponse { SiteRoleRecord role = 1; bool replayed = 2; }
message UpdateSiteRoleRequest { CommandContext command = 1 [(buf.validate.field).required = true]; string site_id = 2 [(buf.validate.field).string.uuid = true]; string role_id = 3 [(buf.validate.field).string.uuid = true]; string name = 4 [(buf.validate.field).string = {min_len: 1, max_len: 120}]; string description = 5 [(buf.validate.field).string = {min_len: 1, max_len: 500}]; }
message UpdateSiteRoleResponse { SiteRoleRecord role = 1; bool replayed = 2; }
message DeleteSiteRoleRequest { CommandContext command = 1 [(buf.validate.field).required = true]; string site_id = 2 [(buf.validate.field).string.uuid = true]; string role_id = 3 [(buf.validate.field).string.uuid = true]; }
message DeleteSiteRoleResponse { SiteRoleRecord role = 1; bool replayed = 2; }
message RestoreSiteRoleRequest { CommandContext command = 1 [(buf.validate.field).required = true]; string site_id = 2 [(buf.validate.field).string.uuid = true]; string role_id = 3 [(buf.validate.field).string.uuid = true]; }
message RestoreSiteRoleResponse { SiteRoleRecord role = 1; bool replayed = 2; }
message SetSiteRolePermissionsRequest { CommandContext command = 1 [(buf.validate.field).required = true]; string site_id = 2 [(buf.validate.field).string.uuid = true]; string role_id = 3 [(buf.validate.field).string.uuid = true]; repeated string permission_keys = 4; }
message SetSiteRolePermissionsResponse { SiteRoleRecord role = 1; bool replayed = 2; }

service IamSiteService {
  rpc CreateSite(CreateSiteRequest) returns (CreateSiteResponse);
  rpc GetSite(GetSiteRequest) returns (GetSiteResponse);
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc UpdateSite(UpdateSiteRequest) returns (UpdateSiteResponse);
  rpc SuspendSite(SuspendSiteRequest) returns (SuspendSiteResponse);
  rpc ReactivateSite(ReactivateSiteRequest) returns (ReactivateSiteResponse);
  rpc DeleteSite(DeleteSiteRequest) returns (DeleteSiteResponse);
  rpc RestoreSite(RestoreSiteRequest) returns (RestoreSiteResponse);
  rpc AddSiteMember(AddSiteMemberRequest) returns (AddSiteMemberResponse);
  rpc ListSiteMembers(ListSiteMembersRequest) returns (ListSiteMembersResponse);
  rpc ChangeSiteMemberRole(ChangeSiteMemberRoleRequest) returns (ChangeSiteMemberRoleResponse);
  rpc SuspendSiteMember(SuspendSiteMemberRequest) returns (SuspendSiteMemberResponse);
  rpc ReactivateSiteMember(ReactivateSiteMemberRequest) returns (ReactivateSiteMemberResponse);
  rpc RemoveSiteMember(RemoveSiteMemberRequest) returns (RemoveSiteMemberResponse);
  rpc RestoreSiteMember(RestoreSiteMemberRequest) returns (RestoreSiteMemberResponse);
  rpc SelectSite(SelectSiteRequest) returns (SelectSiteResponse);
  rpc ListSiteRoles(ListSiteRolesRequest) returns (ListSiteRolesResponse);
  rpc CreateSiteRole(CreateSiteRoleRequest) returns (CreateSiteRoleResponse);
  rpc UpdateSiteRole(UpdateSiteRoleRequest) returns (UpdateSiteRoleResponse);
  rpc DeleteSiteRole(DeleteSiteRoleRequest) returns (DeleteSiteRoleResponse);
  rpc RestoreSiteRole(RestoreSiteRoleRequest) returns (RestoreSiteRoleResponse);
  rpc SetSiteRolePermissions(SetSiteRolePermissionsRequest) returns (SetSiteRolePermissionsResponse);
}
