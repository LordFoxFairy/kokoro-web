syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";

message BootstrapDevelopmentAdministratorRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string email = 3 [(buf.validate.field).string = {email: true, max_len: 320}];
  string name = 4 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
  string password = 5 [(buf.validate.field).string = {min_len: 12, max_len: 128}];
}

message BootstrapDevelopmentAdministratorResponse {
  string status = 1 [(buf.validate.field).string = {in: ["CREATED", "EXISTS"]}];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 320}];
}

message ResetDevelopmentAdministratorPasswordRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 320}];
  string password = 3 [(buf.validate.field).string = {min_len: 12, max_len: 128}];
}

message ResetDevelopmentAdministratorPasswordResponse {
  string status = 1 [(buf.validate.field).string.const = "RESET"];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 320}];
}

service IamDevelopmentFixtureService {
  rpc BootstrapDevelopmentAdministrator(BootstrapDevelopmentAdministratorRequest) returns (BootstrapDevelopmentAdministratorResponse);
  rpc ResetDevelopmentAdministratorPassword(ResetDevelopmentAdministratorPasswordRequest) returns (ResetDevelopmentAdministratorPasswordResponse);
}
