syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";
import "kokoro/iam/v1/types.proto";

message LoginAdministratorRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 320}];
  string password = 3 [(buf.validate.field).string = {min_len: 12, max_len: 128}];
}

message LoginAdministratorResponse {
  UserRecord user = 1;
  SessionRecord session = 2;
}

service IamCredentialService {
  rpc LoginAdministrator(LoginAdministratorRequest) returns (LoginAdministratorResponse);
}
