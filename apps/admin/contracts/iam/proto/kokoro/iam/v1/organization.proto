syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";
import "kokoro/iam/v1/types.proto";

message CreateOrganizationRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string slug = 2 [(buf.validate.field).string = {pattern: "^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$", max_len: 80}];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
}
message CreateOrganizationResponse { OrganizationRecord organization = 1; bool replayed = 2; }

message GetOrganizationRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string organization_id = 2 [(buf.validate.field).string.uuid = true];
  bool include_deleted = 3;
}
message GetOrganizationResponse { optional OrganizationRecord organization = 1; }

message ListOrganizationsRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  PageInput page = 2;
  bool include_deleted = 3;
}
message ListOrganizationsResponse { repeated OrganizationRecord organizations = 1; PageOutput page = 2; }

message UpdateOrganizationRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string organization_id = 2 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
}
message UpdateOrganizationResponse { OrganizationRecord organization = 1; bool replayed = 2; }

message DeleteOrganizationRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string organization_id = 2 [(buf.validate.field).string.uuid = true];
}
message DeleteOrganizationResponse { OrganizationRecord organization = 1; bool replayed = 2; }
message RestoreOrganizationRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string organization_id = 2 [(buf.validate.field).string.uuid = true];
}
message RestoreOrganizationResponse { OrganizationRecord organization = 1; bool replayed = 2; }

message AddMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string organization_id = 2 [(buf.validate.field).string.uuid = true];
  string user_id = 3 [(buf.validate.field).string.uuid = true];
  string role_key = 4 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message AddMemberResponse { MemberRecord member = 1; bool replayed = 2; }

message ListMembersRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string organization_id = 2 [(buf.validate.field).string.uuid = true];
  PageInput page = 3;
  bool include_deleted = 4;
}
message ListMembersResponse { repeated MemberRecord members = 1; PageOutput page = 2; }

message ChangeMemberRoleRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
  string role_key = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message ChangeMemberRoleResponse { MemberRecord member = 1; bool replayed = 2; }

message SuspendMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
}
message SuspendMemberResponse { MemberRecord member = 1; bool replayed = 2; }

message ReactivateMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
}
message ReactivateMemberResponse { MemberRecord member = 1; bool replayed = 2; }

message RemoveMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
}
message RemoveMemberResponse { MemberRecord member = 1; bool replayed = 2; }

message RestoreMemberRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string member_id = 2 [(buf.validate.field).string.uuid = true];
}
message RestoreMemberResponse { MemberRecord member = 1; bool replayed = 2; }

service IamOrganizationService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
  rpc RestoreOrganization(RestoreOrganizationRequest) returns (RestoreOrganizationResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc ChangeMemberRole(ChangeMemberRoleRequest) returns (ChangeMemberRoleResponse);
  rpc SuspendMember(SuspendMemberRequest) returns (SuspendMemberResponse);
  rpc ReactivateMember(ReactivateMemberRequest) returns (ReactivateMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc RestoreMember(RestoreMemberRequest) returns (RestoreMemberResponse);
}
