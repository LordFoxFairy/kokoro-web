syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message CommandContext {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string command_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string = {min_len: 1, max_len: 500}];
  optional uint64 expected_version = 4;
}

message PageInput {
  uint32 limit = 1 [(buf.validate.field).uint32 = {lte: 100}];
  string cursor = 2 [(buf.validate.field).string.max_len = 512];
}

message PageOutput {
  string next_cursor = 1;
}

message UserRecord {
  string id = 1;
  string email = 2;
  string name = 3;
  optional string image = 4;
  optional google.protobuf.Timestamp email_verified = 5;
  string platform_role = 6;
  string status = 7;
  uint64 version = 8;
  optional google.protobuf.Timestamp deleted_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message AccountRecord {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string provider = 4;
  string provider_account_id = 5;
  optional string refresh_token = 6;
  optional string access_token = 7;
  optional int64 expires_at = 8;
  optional string token_type = 9;
  optional string scope = 10;
  optional string id_token = 11;
  optional string session_state = 12;
  string status = 13;
}

message SessionRecord {
  string id = 1;
  string session_token = 2;
  string user_id = 3;
  google.protobuf.Timestamp expires = 4;
  optional string active_organization_id = 5;
  optional google.protobuf.Timestamp revoked_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SessionSummaryRecord {
  string id = 1;
  string user_id = 2;
  google.protobuf.Timestamp expires = 3;
  optional string active_organization_id = 4;
  optional google.protobuf.Timestamp revoked_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message VerificationTokenRecord {
  string identifier = 1;
  string token = 2;
  google.protobuf.Timestamp expires = 3;
}

message OrganizationRecord {
  string id = 1;
  string slug = 2;
  string name = 3;
  string status = 4;
  uint64 version = 5;
  optional google.protobuf.Timestamp deleted_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message MemberRecord {
  string id = 1;
  string organization_id = 2;
  string user_id = 3;
  string role_id = 4;
  string role_key = 5;
  string status = 6;
  uint64 version = 7;
  optional google.protobuf.Timestamp deleted_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message RoleRecord {
  string id = 1;
  string organization_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  bool built_in = 6;
  string status = 7;
  uint64 version = 8;
  repeated string permission_keys = 9;
}

message PermissionRecord {
  string id = 1;
  string key = 2;
  string resource = 3;
  string action = 4;
  string description = 5;
  string status = 6;
}

message SecurityEventRecord {
  string id = 1;
  string kind = 2;
  optional string actor_user_id = 3;
  optional string target_user_id = 4;
  optional string organization_id = 5;
  optional string session_id = 6;
  string request_id = 7;
  optional string command_id = 8;
  string metadata_json = 9;
  google.protobuf.Timestamp created_at = 10;
}
