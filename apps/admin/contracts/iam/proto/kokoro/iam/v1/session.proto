syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/iam/v1/types.proto";

message ListSessionsRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  optional string user_id = 2 [(buf.validate.field).string.uuid = true];
  PageInput page = 3;
}
message ListSessionsResponse { repeated SessionSummaryRecord sessions = 1; PageOutput page = 2; }

message RevokeSessionRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string session_id = 2 [(buf.validate.field).string.uuid = true];
}
message RevokeSessionResponse { bool revoked = 1; bool replayed = 2; }

message RevokeAllSessionsRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  optional string except_session_id = 3 [(buf.validate.field).string.uuid = true];
}
message RevokeAllSessionsResponse { uint32 revoked_count = 1; bool replayed = 2; }

message IssueAccessTokenRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string session_token = 2 [(buf.validate.field).string = {min_len: 32, max_len: 1024}];
  optional string organization_id = 3 [(buf.validate.field).string.uuid = true];
}
message IssueAccessTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

service IamSessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
  rpc IssueAccessToken(IssueAccessTokenRequest) returns (IssueAccessTokenResponse);
}
