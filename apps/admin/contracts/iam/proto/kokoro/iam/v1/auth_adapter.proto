syntax = "proto3";

package kokoro.iam.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/iam/v1/types.proto";

message CreateUserRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 320}];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
  optional string image = 4 [(buf.validate.field).string.max_len = 4096];
}
message CreateUserResponse { UserRecord user = 1; }

message GetUserRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}
message GetUserResponse { optional UserRecord user = 1; }

message GetUserByEmailRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string email = 2 [(buf.validate.field).string = {email: true, max_len: 320}];
}
message GetUserByEmailResponse { optional UserRecord user = 1; }

message GetUserByAccountRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string provider = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string provider_account_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 320}];
}
message GetUserByAccountResponse { optional UserRecord user = 1; }

message UpdateUserRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  optional string email = 3 [(buf.validate.field).string = {email: true, max_len: 320}];
  optional string name = 4 [(buf.validate.field).string = {min_len: 1, max_len: 160}];
  optional string image = 5 [(buf.validate.field).string.max_len = 4096];
  optional google.protobuf.Timestamp email_verified = 6;
}
message UpdateUserResponse { UserRecord user = 1; }

message DeleteUserRequest {
  CommandContext command = 1 [(buf.validate.field).required = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}
message DeleteUserResponse { bool deleted = 1; }

message LinkAccountRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  AccountRecord account = 2 [(buf.validate.field).required = true];
}
message LinkAccountResponse { AccountRecord account = 1; }

message UnlinkAccountRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string provider = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string provider_account_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 320}];
}
message UnlinkAccountResponse { bool unlinked = 1; }

message CreateSessionRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  SessionRecord session = 2 [(buf.validate.field).required = true];
}
message CreateSessionResponse { SessionRecord session = 1; }

message GetSessionAndUserRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string session_token = 2 [(buf.validate.field).string = {min_len: 32, max_len: 1024}];
}
message GetSessionAndUserResponse {
  optional SessionRecord session = 1;
  optional UserRecord user = 2;
}

message UpdateSessionRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string session_token = 2 [(buf.validate.field).string = {min_len: 32, max_len: 1024}];
  optional google.protobuf.Timestamp expires = 3;
  optional string active_organization_id = 4 [(buf.validate.field).string.uuid = true];
}
message UpdateSessionResponse { optional SessionRecord session = 1; }

message DeleteSessionRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string session_token = 2 [(buf.validate.field).string = {min_len: 32, max_len: 1024}];
}
message DeleteSessionResponse { bool deleted = 1; }

message CreateVerificationTokenRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  VerificationTokenRecord verification_token = 2 [(buf.validate.field).required = true];
}
message CreateVerificationTokenResponse { VerificationTokenRecord verification_token = 1; }

message UseVerificationTokenRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string identifier = 2 [(buf.validate.field).string = {min_len: 1, max_len: 320}];
  string token = 3 [(buf.validate.field).string = {min_len: 16, max_len: 1024}];
}
message UseVerificationTokenResponse { optional VerificationTokenRecord verification_token = 1; }

service IamAuthAdapterService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc GetUserByAccount(GetUserByAccountRequest) returns (GetUserByAccountResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc LinkAccount(LinkAccountRequest) returns (LinkAccountResponse);
  rpc UnlinkAccount(UnlinkAccountRequest) returns (UnlinkAccountResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSessionAndUser(GetSessionAndUserRequest) returns (GetSessionAndUserResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc CreateVerificationToken(CreateVerificationTokenRequest) returns (CreateVerificationTokenResponse);
  rpc UseVerificationToken(UseVerificationTokenRequest) returns (UseVerificationTokenResponse);
}
