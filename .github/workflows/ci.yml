name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install pinned pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: typecheck
        run: pnpm -r typecheck
      - name: lint
        run: pnpm -r lint
      - name: test
        run: pnpm test
      - name: build user site
        run: pnpm build
      - name: build admin console
        run: pnpm --filter @kokoro/admin-web build
        env:
          AUTH_SECRET: example-ci-auth-secret
          KOKORO_GATEWAY_URL: http://127.0.0.1:4250
          KOKORO_ADMIN_PROXY_SECRET: example-ci-proxy-secret
          EMAIL_SERVER_HOST: 127.0.0.1
          EMAIL_SERVER_PORT: "2525"
      - name: build reference site fixture
        run: pnpm --filter @kokoro/reference-site build
