name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.2.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm -r typecheck
      - name: lint
        run: pnpm -r lint
      - name: test
        run: pnpm -r test
      - name: build user site
        run: pnpm --filter @kokoro/web-user build
      - name: build admin console
        run: pnpm --filter @kokoro/admin-web build
        env:
          AUTH_SECRET: example-ci-auth-secret
          KOKORO_GATEWAY_URL: http://127.0.0.1:4250
          KOKORO_ADMIN_PROXY_SECRET: example-ci-proxy-secret
          EMAIL_SERVER_HOST: 127.0.0.1
          EMAIL_SERVER_PORT: "2525"
